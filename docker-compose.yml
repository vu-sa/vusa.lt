# For more information: https://laravel.com/docs/sail
services:
    nginx:
        image: 'nginx:latest'
        ports:
            - '${HTTP_PORT:-8000}:80'
            - '${SSL_PORT:-443}:443'
        environment:
            - SSL_PORT=${SSL_PORT:-443}
            - APP_SERVICE=${APP_SERVICE:-laravel.test}
            - SERVER_NAME=${SERVER_NAME:-localhost}
            - SSL_DOMAIN=${SSL_DOMAIN:-localhost}
            - SSL_ALT_NAME=${SSL_ALT_NAME:-DNS:localhost}
        volumes:
            - 'sail-nginx:/etc/nginx/certs'
            - './docker/nginx/templates:/etc/nginx/templates'
            - './vendor/ryoluo/sail-ssl/nginx/generate-ssl-cert.sh:/docker-entrypoint.d/99-generate-ssl-cert.sh'
        depends_on:
            - ${APP_SERVICE:-laravel.test}
            - reverb
        networks:
            - sail
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.5/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
            - 'www.vusa.test:127.0.0.1'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
            - '${STORYBOOK_PORT:-6006}:${STORYBOOK_PORT:-6006}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
        volumes:
            - '.:/var/www/html:delegated'
            - './.pest-cache:/home/sail/.pest'
        networks:
            - sail
        depends_on:
            - mariadb
    mariadb:
        image: 'mariadb:10'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        volumes:
            - 'sailmariadb:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sailredis:/data'
        networks:
            - sail
        command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            retries: 3
            timeout: 5s
    adminer:
        image: adminer:latest
        ports:
            - 8080:8080
        environment:
            ADMINER_DEFAULT_SERVER: mariadb
        networks:
          - sail
        depends_on:
          - mariadb
    typesense:
        image: 'typesense/typesense:30.2'
        ports:
            - '${FORWARD_TYPESENSE_PORT:-8108}:8108'
        environment:
            TYPESENSE_DATA_DIR: '${TYPESENSE_DATA_DIR:-/typesense-data}'
            TYPESENSE_API_KEY: '${TYPESENSE_API_KEY:-xyz}'
            TYPESENSE_ENABLE_CORS: '${TYPESENSE_ENABLE_CORS:-true}'
        volumes:
            - 'sail-typesense:/typesense-data'
        networks:
            - sail
        healthcheck:
            test: [CMD, bash, -c, "exec 3<>/dev/tcp/localhost/8108 && printf 'GET /health HTTP/1.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep '200' && exec 3>&-"]
            retries: 5
            timeout: 7s
    umami:
        image: 'ghcr.io/umami-software/umami:postgresql-latest'
        ports:
            # Host port is 3001 because the container always listens on 3000 internally.
            - '${FORWARD_UMAMI_PORT:-3001}:3000'
        environment:
            DATABASE_URL: 'postgresql://umami:umami@umami-db:5432/umami'
            APP_SECRET: '${UMAMI_APP_SECRET:-local-dev-secret}'
        depends_on:
            umami-db:
                condition: service_healthy
        init: true
        networks:
            - sail
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:3000/api/heartbeat || exit 1"]
            retries: 5
            timeout: 5s
    umami-db:
        image: 'postgres:15-alpine'
        environment:
            POSTGRES_DB: umami
            POSTGRES_USER: umami
            POSTGRES_PASSWORD: umami
        volumes:
            - 'sail-umami-db:/var/lib/postgresql/data'
        networks:
            - sail
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
            retries: 5
            timeout: 5s
    reverb:
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.5/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${REVERB_PORT:-6001}:6001'
        command: 'php artisan reverb:start --host=0.0.0.0 --port=6001'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            APP_ENV: '${APP_ENV:-local}'
            APP_DEBUG: '${APP_DEBUG:-true}'
            DB_CONNECTION: '${DB_CONNECTION:-mariadb}'
            DB_HOST: '${DB_HOST:-mariadb}'
            DB_PORT: '${DB_PORT:-3306}'
            DB_DATABASE: '${DB_DATABASE}'
            DB_USERNAME: '${DB_USERNAME}'
            DB_PASSWORD: '${DB_PASSWORD}'
            REDIS_HOST: '${REDIS_HOST:-redis}'
            REVERB_APP_ID: '${REVERB_APP_ID}'
            REVERB_APP_KEY: '${REVERB_APP_KEY}'
            REVERB_APP_SECRET: '${REVERB_APP_SECRET}'
        volumes:
            - '.:/var/www/html:delegated'
        networks:
            - sail
        depends_on:
            - mariadb
            - redis

    # Konferencijos: a local Mailman 3 standing in for konf.vusa.lt. Opt-in, so a plain `sail up`
    # skips it: set COMPOSE_PROFILES=mailman in .env, then `sail up -d` and docker/mailman/seed.sh.
    mailman-core:
        image: 'maxking/mailman-core:0.5.2'
        profiles: [mailman]
        hostname: mailman-core
        environment:
            DATABASE_URL: 'postgresql://mailman:mailman@mailman-db/mailman'
            DATABASE_TYPE: postgres
            DATABASE_CLASS: mailman.database.postgresql.PostgreSQLDatabase
            HYPERKITTY_API_KEY: '${MAILMAN_LOCAL_ARCHIVER_KEY:-local-archiver-key}'
            HYPERKITTY_URL: 'http://mailman-web:8000/hyperkitty/'
            MAILMAN_REST_USER: '${MAILMAN_USERNAME:-vusa-app}'
            MAILMAN_REST_PASSWORD: '${MAILMAN_PASSWORD:-vusa-local}'
            # Every message a list sends lands in Mailpit (http://localhost:8025).
            SMTP_HOST: mailpit
            SMTP_PORT: 1025
            TZ: Europe/Vilnius
        volumes:
            - 'sail-mailman-core:/opt/mailman'
        depends_on:
            mailman-db:
                condition: service_healthy
        networks:
            - sail
    mailman-web:
        image: 'maxking/mailman-web:0.5.2'
        profiles: [mailman]
        hostname: mailman-web
        ports:
            - '${FORWARD_MAILMAN_WEB_PORT:-8095}:8000'
        environment:
            DATABASE_URL: 'postgresql://mailman:mailman@mailman-db/mailman'
            DATABASE_TYPE: postgres
            HYPERKITTY_API_KEY: '${MAILMAN_LOCAL_ARCHIVER_KEY:-local-archiver-key}'
            MAILMAN_REST_URL: 'http://mailman-core:8001'
            MAILMAN_REST_USER: '${MAILMAN_USERNAME:-vusa-app}'
            MAILMAN_REST_PASSWORD: '${MAILMAN_PASSWORD:-vusa-local}'
            SECRET_KEY: local-mailman-web-secret
            SERVE_FROM_DOMAIN: localhost
            DJANGO_ALLOWED_HOSTS: 'localhost,mailman-web'
            # The image expects an nginx in front for /static; locally uWSGI serves it itself.
            UWSGI_STATIC_MAP: '/static=/opt/mailman-web-data/static'
            # The archive service account the app reads HyperKitty with, created on first start.
            MAILMAN_ADMIN_USER: '${MAILMAN_ARCHIVES_USERNAME:-vusa-app-archive}'
            MAILMAN_ADMIN_EMAIL: 'it@vusa.lt'
            DJANGO_SUPERUSER_PASSWORD: '${MAILMAN_ARCHIVES_PASSWORD:-vusa-local}'
            SMTP_HOST: mailpit
            SMTP_PORT: 1025
            TZ: Europe/Vilnius
        volumes:
            - 'sail-mailman-web:/opt/mailman-web-data'
        depends_on:
            mailman-db:
                condition: service_healthy
            mailman-core:
                condition: service_started
        networks:
            - sail
    mailman-db:
        image: 'postgres:16-alpine'
        profiles: [mailman]
        environment:
            POSTGRES_DB: mailman
            POSTGRES_USER: mailman
            POSTGRES_PASSWORD: mailman
        volumes:
            - 'sail-mailman-db:/var/lib/postgresql/data'
        networks:
            - sail
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U mailman -d mailman"]
            retries: 5
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-nginx:
        driver: local
    sailmariadb:
        driver: local
    sailredis:
        driver: local
    sail-typesense:
        driver: local
    sail-umami-db:
        driver: local
    sail-mailman-core:
        driver: local
    sail-mailman-web:
        driver: local
    sail-mailman-db:
        driver: local
