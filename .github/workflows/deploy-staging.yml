name: Deploy To Staging

concurrency: staging

on:
  # Staging tracks `dev` automatically, the same way production tracks `main`. Before this it was
  # dispatch-only and had gone four months without a deploy, which made it useless as a preview of
  # the next release — and meant migrations were first exercised against real data in production.
  workflow_run:
    workflows: ["CI"]
    branches:
      - dev
    types:
      - completed
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: false
        default: ''
        type: string

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/deploy-common.yml
    secrets: inherit
    with:
      environment: Staging
      ref: ${{ github.event.inputs.branch || github.event.workflow_run.head_branch || 'dev' }}
      # Staging deploys a moving branch rather than a pinned commit: the server checks the branch out
      # and resets to its remote tip, so a manual dispatch of an arbitrary branch works too.
      remote-branch: ${{ github.event.inputs.branch || github.event.workflow_run.head_branch || 'dev' }}
      # The staging database is replaced wholesale by the nightly refresh from production, so dumping
      # it before every deploy is pure downtime protecting nothing.
      run-backup: false
      # Staging switches between arbitrary branches, so it accumulates files from the ones it left.
      clean-untracked: true
