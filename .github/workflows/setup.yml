name: Common Setup

on:
  workflow_call:
    inputs:
      php-version:
        required: false
        type: string
        default: '8.5'
      include-coverage:
        required: false
        type: boolean
        default: false
      node-version:
        required: false
        type: string
        default: '20'
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo
          coverage: ${{ inputs.include-coverage && 'pcov' || 'none' }}

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.composer/cache
            vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Copy .env and generate key
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build development frontend assets
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: npm run build

      # vendor/ is ~600MB across tens of thousands of small files, and upload-artifact bills that
      # per file: uploading it raw took 67s, on the critical path of every downstream job. One
      # tarball uploads in a fraction of that; consumers untar it after downloading.
      - name: Pack vendor directory
        run: tar -czf vendor.tar.gz vendor

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-assets
          path: |
            public/build
            vendor.tar.gz
          retention-days: 1
        # Note: public/build contains development build (no secrets)
        # Production build with secrets happens in deploy.yml
