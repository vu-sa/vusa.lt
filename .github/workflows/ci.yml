name: CI

on:
  push:
    branches:
      - main
      # `dev` is here for two reasons. It is what deploy-staging.yml's workflow_run trigger listens
      # for — a pull_request run reports the *source* branch, so a PR into dev never produces a run
      # whose head_branch is `dev`, and staging would sit un-deployed forever waiting for one.
      # It also closes a real gap: dev is updated by direct merge-pushes as well as PRs, and those
      # pushes previously ran no CI at all — the code was first tested when the dev→main PR opened.
      # Runs here are full (no --tia, same as main), which is free on a public repo.
      - dev
  pull_request:
    branches-ignore:
      - 'dependabot/npm_and_yarn/*'
      - 'dependabot/composer/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      php: ${{ steps.filter.outputs.php }}
      js: ${{ steps.filter.outputs.js }}
    steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          php:
            - '**/*.php'
            - 'composer.json'
            - 'composer.lock'
            - 'phpunit.xml'
            - 'phpstan.neon'
          js:
            - '**/*.vue'
            - '**/*.js'
            - '**/*.ts'
            - '**/*.tsx'
            - 'package.json'
            - 'package-lock.json'
            - 'vite.config.mts'
            - 'tsconfig.json'

  setup:
    needs: changes
    if: ${{ needs.changes.outputs.php == 'true' || needs.changes.outputs.js == 'true' || github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/setup.yml
    with:
      include-coverage: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # PHP Jobs - run in parallel where possible
  php-static-analysis:
    needs: [changes, setup]
    if: ${{ needs.changes.outputs.php == 'true' }}
    runs-on: ubuntu-latest
    name: PHP Static Analysis
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-assets
          path: ./

      - name: Unpack vendor
        run: tar -xzf vendor.tar.gz

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, fileinfo

      - name: Fix permissions
        run: |
          chmod -R +x vendor/bin
          chmod -R +x vendor/phpstan/phpstan

      - name: Set up environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Running Static Analysis
        run: vendor/bin/phpstan analyze --no-progress --memory-limit=1G

  php-tests:
    needs: [changes, setup]
    if: ${{ needs.changes.outputs.php == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    name: PHP Tests
    # actions: read lets Pest's TIA baseline sync pull the pest-tia-baseline artifact via `gh`.
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
        # fetch-depth: 0 — TIA anchors the graph to a commit and resolves changes with
        # `git merge-base --is-ancestor` / `git diff <sha>..HEAD`; a shallow clone breaks reachability
        # and silently degrades every PR back to a full run.
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: build-assets
        path: ./

    - name: Unpack vendor
      run: tar -xzf vendor.tar.gz

    - name: Start Typesense
      run: |
        docker run -d --name typesense \
          -p 8108:8108 \
          -v /tmp/typesense-data:/data \
          typesense/typesense:30.2 \
          --data-dir /data \
          --api-key=xyz \
          --enable-cors
        # Wait for Typesense to be ready
        until curl -s http://localhost:8108/health | grep -q '"ok"'; do sleep 1; done

    - name: Setup PHP with PCOV
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.5
        extensions: dom, curl, libxml, mbstring, zip, fileinfo
        coverage: pcov

    - name: Create .env
      run: |
        cp .env.example .env
        php artisan key:generate --force

    # Pull requests run Test Impact Analysis against the baseline recorded by tia-baseline.yml,
    # replaying unaffected tests. Pushes to main deliberately stay a full run — that is the safety
    # net for anything a stale graph lets slip through on a PR.
    #
    # Flag order is load-bearing: `--tia` MUST precede `--parallel`, otherwise ParaTest's option
    # validation rejects it with `The "--tia" option does not exist.`
    - name: Execute tests with coverage
      env:
        SCOUT_DRIVER: database
        TYPESENSE_HOST: localhost
        TYPESENSE_PORT: 8108
        TYPESENSE_API_KEY: xyz
        TYPESENSE_PROTOCOL: http
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: php artisan test --ci ${{ github.event_name == 'pull_request' && '--tia' || '' }} --parallel --coverage --coverage-clover ./coverage.xml --log-junit ./test-results.xml

    # Advisory report (feature areas documented, routes tested, the writing
    # backlog, pages that may have drifted) lands in the job summary so nobody
    # has to remember to run it. --strict is the only gate, and only for the one
    # unambiguous breakage: a doc page citing a test file that no longer exists.
    - name: Report and gate documentation coverage
      if: always()
      run: php artisan docs:coverage --strict --summary

    # A judgement call is never a gate, so the reviewer gets it where they will
    # actually read it — one sticky comment on the PR, rewritten each push. The
    # report and the "docs to re-check" list are rebuilt into a temp file
    # ($GITHUB_STEP_SUMMARY is per-step, so a later step cannot read the gate
    # step's summary) and posted as the current author.
    - name: Comment documentation coverage on the PR
      if: always() && github.event_name == 'pull_request'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tmp="$(mktemp)"
        GITHUB_STEP_SUMMARY="$tmp" php artisan docs:coverage --summary
        GITHUB_STEP_SUMMARY="$tmp" php artisan docs:coverage --changed=origin/${{ github.base_ref }} --summary
        { echo "<!-- docs-coverage -->"; cat "$tmp"; } > pr-comment.md
        gh pr comment "${{ github.event.number }}" --edit-last --create-if-none --body-file pr-comment.md

    - name: Upload test results to Codecov
      if: always()
      uses: codecov/test-results-action@v1
      with:
        files: ./test-results.xml
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        flags: backend
        name: backend-coverage
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # JS Jobs - run in parallel with PHP jobs
  #
  # Deliberately does NOT depend on `setup`: the unit/component projects are pure jsdom and read
  # nothing from that job's artifact — no `vendor/`, no `public/build`, no `.env`. Waiting on it
  # was adding its full duration to the critical path for no benefit.
  js-tests:
    needs: changes
    if: ${{ needs.changes.outputs.js == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    name: Frontend Tests
    steps:
    - uses: actions/checkout@v7
      with:
        # Vitest's --changed resolves the diff with git, so the base branch has to be reachable.
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install npm dependencies
      run: npm ci

    # Same contract as Pest TIA on php-tests: pull requests run only the specs whose dependency
    # graph reaches a changed file, pushes to main run everything. `forceRerunTriggers` in
    # vitest.config.ts escalates back to a full run when a shared file (tests/setup.ts,
    # resources/js/mocks/**, package.json) changes.
    - name: Execute tests with coverage
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          git fetch --no-tags origin "${{ github.base_ref }}"
          npm run coverage:ci -- --changed "origin/${{ github.base_ref }}" --passWithNoTests
        else
          npm run coverage:ci
        fi

    - name: Upload test results to Codecov
      if: always()
      uses: codecov/test-results-action@v1
      with:
        files: ./test-results.junit.xml
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage/clover.xml
        flags: frontend
        name: frontend-coverage
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Storybook stories, run as tests in a real Chromium (@storybook/addon-vitest + @vitest/browser).
  #
  # Separate from js-tests because `coverage:ci` deliberately runs only the unit and component
  # projects — the storybook project needs Playwright browser binaries, which those don't. It is
  # also the only place the design system can actually be checked: jsdom cannot resolve
  # Tailwind's `dark:` variant, so a component test can assert a class is bound but never that
  # it renders. See .storybook/CLAUDE.md.
  storybook-tests:
    needs: changes
    if: ${{ needs.changes.outputs.js == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Non-blocking while the public design system is being built out, matching how browser-tests
    # was introduced. Drop `continue-on-error` once the Public/Base primitives have stories and
    # 2-3 consecutive runs are green.
    continue-on-error: true
    name: Storybook Tests
    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run Storybook stories as tests
      run: npm run test:storybook -- --run

  # Real-browser tests (Playwright via pestphp/pest-plugin-browser). Separate from php-tests
  # because it needs Node + Playwright browser binaries, which that job doesn't otherwise use.
  browser-tests:
    needs: [changes, setup]
    if: ${{ needs.changes.outputs.php == 'true' || needs.changes.outputs.js == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Non-blocking for now — this is the first Pest browser-test job in the repo, and Playwright
    # setup (browser binary download, system deps) can fail for reasons unrelated to the code
    # under test. Drop `continue-on-error` once 2-3 consecutive runs are green.
    continue-on-error: true
    name: Browser Tests
    steps:
    - uses: actions/checkout@v7

    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: build-assets
        path: ./

    - name: Unpack vendor
      run: tar -xzf vendor.tar.gz

    - name: Fix permissions
      run: chmod -R +x vendor/bin

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.5
        extensions: dom, curl, libxml, mbstring, zip, fileinfo, sockets

    - name: Set up environment
      run: |
        cp .env.example .env
        php artisan key:generate --force

    # routes/web.php registers public routes under Route::domain('{subdomain}.vusa.test') groups;
    # the plugin's ephemeral test server always binds to 127.0.0.1, so the runner needs to resolve
    # that hostname to itself for tenant-subdomain routing to work at all. See tests/Browser/README.md.
    - name: Add local domain to /etc/hosts
      run: echo "127.0.0.1 www.vusa.test" | sudo tee -a /etc/hosts

    - name: Run browser tests
      run: vendor/bin/pest tests/Browser --compact

    # A bare Playwright timeout says nothing about *why* the page never rendered. The screenshot
    # and captured HTML (see captureBrowserDiagnostics() in tests/Pest.php) separate "still
    # rendering" from a 500/404, without pushing speculative commits to find out.
    - name: Upload browser failure diagnostics
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: browser-test-diagnostics
        path: |
          tests/Browser/Screenshots
          storage/logs
        retention-days: 7
        if-no-files-found: ignore

  # JS Quality - TypeScript typecheck and ESLint (non-blocking)
  js-quality:
    needs: [changes, setup]
    if: ${{ needs.changes.outputs.js == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    name: TypeScript & ESLint
    steps:
    - uses: actions/checkout@v7

    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: build-assets
        path: ./

    - name: Unpack vendor
      run: tar -xzf vendor.tar.gz

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install npm dependencies
      run: npm ci

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.5
        extensions: dom, curl, libxml, mbstring, zip, fileinfo

    - name: Set up environment
      run: |
        cp .env.example .env
        php artisan key:generate --force

    - name: Generate Ziggy route types
      run: php artisan ziggy:generate --types-only node_modules/vite-plugin-ziggy/routes --no-interaction

    - name: TypeScript Typecheck
      run: npm run typecheck
      continue-on-error: true

    - name: ESLint Check
      run: npm run lint
      continue-on-error: true

  status-check:
    name: CI Status
    needs: [changes, php-static-analysis, php-tests, js-tests, js-quality, browser-tests, storybook-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Set status
        run: |
          STATIC_ANALYSIS_RESULT="${{ needs.php-static-analysis.result }}"
          PHP_TESTS_RESULT="${{ needs.php-tests.result }}"
          JS_TESTS_RESULT="${{ needs.js-tests.result }}"
          JS_QUALITY_RESULT="${{ needs.js-quality.result }}"
          BROWSER_TESTS_RESULT="${{ needs.browser-tests.result }}"
          STORYBOOK_TESTS_RESULT="${{ needs.storybook-tests.result }}"

          echo "Results: Static Analysis=$STATIC_ANALYSIS_RESULT, PHP Tests=$PHP_TESTS_RESULT, JS Tests=$JS_TESTS_RESULT, JS Quality=$JS_QUALITY_RESULT, Browser Tests=$BROWSER_TESTS_RESULT, Storybook Tests=$STORYBOOK_TESTS_RESULT"

          # Check if any required job failed (js-quality, browser-tests and storybook-tests are non-blocking)
          if [[ "$STATIC_ANALYSIS_RESULT" == "failure" ]] || [[ "$PHP_TESTS_RESULT" == "failure" ]] || [[ "$JS_TESTS_RESULT" == "failure" ]]; then
            echo "❌ Some checks failed"
            exit 1
          fi

          # Report non-blocking job status (informational only)
          if [[ "$JS_QUALITY_RESULT" == "failure" ]]; then
            echo "⚠️ TypeScript/ESLint check has issues (non-blocking)"
          fi

          if [[ "$BROWSER_TESTS_RESULT" == "failure" ]]; then
            echo "⚠️ Browser tests have issues (non-blocking)"
          fi

          if [[ "$STORYBOOK_TESTS_RESULT" == "failure" ]]; then
            echo "⚠️ Storybook tests have issues (non-blocking)"
          fi

          # All required jobs either succeeded or were skipped
          echo "✅ All required checks passed or were skipped"
          exit 0
