name: Deploy To Production

concurrency: production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed

jobs:
  deploy:
    # Only deploy if tests were successful or this is a manual trigger
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/deploy-common.yml
    secrets: inherit
    with:
      environment: Production
      # Pin to the exact commit that triggered this run, on the runner and on the server alike.
      # Without an explicit ref, a workflow_run trigger checks out main's HEAD *at the time this job
      # starts* — which can drift from the commit the server later `git`s to, if another push landed
      # in between. That reintroduces the app-code/vendor mismatch this workflow exists to prevent.
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      remote-sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      run-backup: true
      # Never on production: its repo root holds ~1 GB of untracked directories (two copies of the
      # old LimeSurvey install) that `git clean -fd` would silently delete.
      clean-untracked: false
