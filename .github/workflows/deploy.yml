name: Deploy To Production

concurrency: production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed

jobs:
  deploy:
    # Only deploy if tests were successful or this is a manual trigger
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo

      # Only the package download cache is cached — never `vendor` itself.
      # `restore-keys` falls back to a cache built from a *different* composer.lock, and a
      # restored `vendor` keeps files from package versions that are no longer installed.
      # That shipped a stale intervention/image-laravel and broke `artisan optimize` in
      # production. Composer rebuilds vendor quickly from the warm download cache.
      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build production frontend assets
        run: |
          VITE_ARCHYVAS_PASSWORD=${{ secrets.ARCHYVAS_PASSWORD }} \
          VITE_ATSTOVAI_PASSWORD=${{ secrets.ATSTOVAI_PASSWORD }} \
          VITE_SHAREPOINT_CLIENT_ID=${{ secrets.SHAREPOINT_CLIENT_ID }} \
          VITE_SHAREPOINT_TENANT_ID=${{ secrets.SHAREPOINT_TENANT_ID }} \
          VITE_REVERB_APP_KEY=${{ secrets.REVERB_APP_KEY }} \
          VITE_REVERB_HOST=${{ vars.REVERB_HOST }} \
          VITE_REVERB_PORT=${{ vars.REVERB_PORT }} \
          VITE_REVERB_SCHEME=${{ vars.REVERB_SCHEME }} \
          npm run build

      - name: Install SSH keys
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts

      - name: Package build artifacts
        run: |
          tar -czf build.tar.gz public/build
          tar -czf vendor.tar.gz vendor

      # Build docs if needed
      - name: Build docs
        run: |
          npm run docs:build
          tar -czf docs.tar.gz -C public/docs .

      # Upload build artifacts
      - name: Upload build artifacts
        run: |
          echo "Uploading build artifacts..."
          scp build.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.SITE_DIR }}/build.tar.gz
          scp vendor.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.SITE_DIR }}/vendor.tar.gz

          # Upload docs changes
          echo "Uploading documentation..."
          if [ -f docs.tar.gz ]; then
            scp docs.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.SITE_DIR }}/docs.tar.gz
          fi

      # Run deployment process
      #
      # Order matters here. `php artisan down --render` is called FIRST, against the
      # still-matching old app code + old vendor/, so it boots cleanly and prerenders the
      # maintenance page — which public/index.php then serves without loading Composer at
      # all. Only once the site is safely behind that static page do we `git pull` and
      # swap vendor/ in via plain shell (not via an artisan-driven step): any `php artisan
      # ...` call boots the full framework, including service providers that reference app
      # classes, before the command itself runs. If a deploy adds/changes a Composer
      # dependency and vendor/ isn't swapped yet, that boot fatals with a missing-class
      # error — and doing the swap from inside deployment:run's own asset step is too late,
      # since deployment:run itself is the first artisan call after the pull. Swapping via
      # shell here, before any artisan command touches the new code, avoids both the
      # chicken-and-egg boot crash and a live-traffic window with a missing vendor/.
      - name: Deploy to production
        run: |
          ssh -T ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd ${{ vars.SITE_DIR }} && \
          /opt/php85/bin/php artisan down --retry=60 --render=errors::maintenance --refresh=15 && \
          git pull && \
          rm -rf vendor.new && \
          mkdir vendor.new && \
          tar -xzf vendor.tar.gz -C vendor.new && \
          rm -rf vendor.old && \
          mv vendor vendor.old && \
          mv vendor.new/vendor vendor && \
          rm -rf vendor.new vendor.tar.gz && \
          /opt/php85/bin/php artisan deployment:run"

      # Resume deployment if failed (optional recovery step)
      - name: Resume deployment
        if: failure()
        run: |
          echo "⚠️ Deployment failed, attempting to resume..."
          ssh -T ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd ${{ vars.SITE_DIR }} && \
          /opt/php85/bin/php artisan deployment:resume"

      # Clean up SSH keys
      - name: Cleanup
        run: |
          rm -rf ~/.ssh


      # Notify about deployment completion
      - name: Deployment notification
        if: success()
        run: |
          echo "::notice::Deployment to production completed successfully at $(date)"
