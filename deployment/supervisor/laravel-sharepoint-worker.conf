[program:laravel-sharepoint-worker]
process_name=%(program_name)s_%(process_num)02d
command=/opt/php85/bin/php /var/www/vusa_lt_usr/data/www/vusa.lt/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --queue="sharepoint-sync"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=vusa_lt_usr
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/vusa_lt_usr/data/www/vusa.lt/storage/logs/sharepoint-sync-queue.log
stopwaitsecs=3600
